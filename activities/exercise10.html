<html>
<head>
    <title>ADRIAN CRISTOBAL 1B</title>
</head>
<body style="background-color: #eeeeee; font-family: Arial;">

    <div style="background-color: #d8cba0;
                width: 500px;
                margin: 30px auto;
                padding: 15px;
                border: 3px solid gray;">

        <h1 style="background-color: #b86f7b;
                   color: white;
                   text-align: center;
                   padding: 20px;">
            Contact Us!
        </h1>

        <form>
            <input type="text" placeholder="Name..."
                   style="width: 95%; padding: 12px;
                   margin-bottom: 15px;">

            <input type="email" placeholder="Email..."
                   style="width: 95%; padding: 12px;
                   margin-bottom: 15px;">

            <input type="text" placeholder="Subject..."
                   style="width: 95%; padding: 12px;
                   margin-bottom: 15px;">

            <textarea placeholder="Message........"
                      rows="5"
                      style="width: 95%; padding: 12px;
                      margin-bottom: 20px;"></textarea>

            <button type="submit"
                    style="width: 100%; padding: 15px;
                    background-color: #c5b44d;
                    color: white; border: 2px solid gray;
                    font-size: 16px;">
                SEND MESSAGE
            </button>
        </form>

    </div>

</body>
</html>
